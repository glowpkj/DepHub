name: Update DepHub Manifest

on:
  push:
    branches:
      - main
    paths:
      - "DepHub.lua"
      - "src/core/**"
      - "src/games/**"
      - ".github/dephub-games.json"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          config = json.loads(Path('.github/dephub-games.json').read_text())
          games = {}

          for place_id, game in config.items():
              tracked_files = list(game['files'])
              digest = hashlib.sha256()

              for path in tracked_files:
                  file_path = Path(path)
                  if not file_path.is_file():
                      raise SystemExit(f'Missing tracked file: {path}')
                  data = file_path.read_bytes()
                  digest.update(path.encode())
                  digest.update(b'\0')
                  digest.update(data)
                  digest.update(b'\0')

              games[place_id] = {
                  'name': game['name'],
                  'version': digest.hexdigest(),
                  'commit': os.environ['COMMIT_SHA'],
                  'files': tracked_files
              }

          manifest = {
              'schema': 2,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'commit': os.environ['COMMIT_SHA'],
              'games': games
          }

          Path('src/update-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Publish manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/update-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update game manifest"
          git push
