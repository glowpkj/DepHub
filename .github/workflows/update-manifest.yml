name: Update DepHub Manifest

on:
  push:
    branches:
      - main
    paths:
      - "DepHub.lua"
      - "src/core/**"
      - "src/games/**"
      - "src/version.txt"
      - ".github/dephub-games.json"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          config = json.loads(Path('.github/dephub-games.json').read_text())
          games = {}
          all_tracked = set()

          for place_id, game in config.items():
              tracked_files = list(game['files'])
              all_tracked.update(tracked_files)
              digest = hashlib.sha256()

              for path in tracked_files:
                  file_path = Path(path)
                  if not file_path.is_file():
                      raise SystemExit(f'Missing tracked file: {path}')
                  data = file_path.read_bytes()
                  digest.update(path.encode())
                  digest.update(b'\0')
                  digest.update(data)
                  digest.update(b'\0')

              games[place_id] = {
                  'name': game['name'],
                  'version': digest.hexdigest(),
                  'commit': os.environ['COMMIT_SHA'],
                  'files': tracked_files
              }

          recent = []
          commit_list = subprocess.check_output(
              ['git', 'rev-list', '--max-count=30', os.environ['COMMIT_SHA']],
              text=True
          ).splitlines()

          for commit in commit_list:
              if len(recent) >= 5:
                  break

              changed = subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', commit],
                  text=True
              ).splitlines()
              relevant = [path for path in changed if path in all_tracked]

              if not relevant:
                  continue

              subject = subprocess.check_output(
                  ['git', 'show', '-s', '--format=%s', commit],
                  text=True
              ).strip()
              date = subprocess.check_output(
                  ['git', 'show', '-s', '--format=%cI', commit],
                  text=True
              ).strip()

              recent.append({
                  'Version': commit[:7],
                  'Date': date,
                  'Changes': [subject]
              })

          manifest = {
              'schema': 2,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'commit': os.environ['COMMIT_SHA'],
              'version': Path('src/version.txt').read_text().strip(),
              'games': games,
              'recentUpdates': recent
          }

          Path('src/update-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Publish manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/update-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update game manifest"
          git push
